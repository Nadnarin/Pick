<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDGs Gender Equality</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
overflow:hidden;
background:#87CEEB;
}

.topbar{
position:absolute;
top:15px;
left:20px;
right:20px;
display:flex;
justify-content:space-between;
z-index:100;
font-size:24px;
font-weight:bold;
color:white;
text-shadow:2px 2px 4px black;
}

.game{
width:100vw;
height:100vh;
position:relative;
background:
linear-gradient(#87CEEB 65%, #68b85e 65%);
}

.sun{
position:absolute;
top:50px;
right:100px;
width:80px;
height:80px;
border-radius:50%;
background:yellow;
}

.hut{
position:absolute;
width:90px;
height:90px;
cursor:pointer;
transition:.3s;
}

.hut:hover{
transform:scale(1.1);
}

.roof{
width:0;
height:0;
border-left:45px solid transparent;
border-right:45px solid transparent;
border-bottom:50px solid #b8860b;
}

.house{
width:90px;
height:50px;
background:#d2b48c;
position:relative;
}

.door{
position:absolute;
bottom:0;
left:35px;
width:20px;
height:30px;
background:brown;
}

.disabled{
opacity:.4;
pointer-events:none;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
justify-content:center;
align-items:center;
z-index:1000;
}

.questionBox{
background:white;
width:500px;
padding:25px;
border-radius:15px;
text-align:center;
}

.option{
display:block;
margin:10px;
padding:12px;
background:#eee;
border:none;
width:100%;
cursor:pointer;
border-radius:10px;
font-size:16px;
}

.option:hover{
background:#d9d9d9;
}

.resultScreen{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
color:white;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:2000;
}

.resultScreen button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:20px;
}

</style>
</head>

<body>

<div class="topbar">
<div>SDGs Gender Equality</div>
<div>Correct: <span id="score">0</span></div>
</div>

<div class="game">

<div class="sun"></div>

<div class="hut" style="left:8%;top:65%" onclick="openQuestion(0,this)">
<div class="roof"></div>
<div class="house"><div class="door"></div></div>
</div>

<div class="hut" style="left:25%;top:60%" onclick="openQuestion(1,this)">
<div class="roof"></div>
<div class="house"><div class="door"></div></div>
</div>

<div class="hut" style="left:40%;top:70%" onclick="openQuestion(2,this)">
<div class="roof"></div>
<div class="house"><div class="door"></div></div>
</div>

<div class="hut" style="left:58%;top:60%" onclick="openQuestion(3,this)">
<div class="roof"></div>
<div class="house"><div class="door"></div></div>
</div>

<div class="hut" style="left:75%;top:70%" onclick="openQuestion(4,this)">
<div class="roof"></div>
<div class="house"><div class="door"></div></div>
</div>

<div class="hut" style="left:15%;top:35%" onclick="openQuestion(5,this)">
<div class="roof"></div>
<div class="house"><div class="door"></div></div>
</div>

<div class="hut" style="left:32%;top:30%" onclick="openQuestion(6,this)">
<div class="roof"></div>
<div class="house"><div class="door"></div></div>
</div>

<div class="hut" style="left:50%;top:40%" onclick="openQuestion(7,this)">
<div class="roof"></div>
<div class="house"><div class="door"></div></div>
</div>

<div class="hut" style="left:65%;top:30%" onclick="openQuestion(8,this)">
<div class="roof"></div>
<div class="house"><div class="door"></div></div>
</div>

<div class="hut" style="left:82%;top:40%" onclick="openQuestion(9,this)">
<div class="roof"></div>
<div class="house"><div class="door"></div></div>
</div>

</div>


<div class="modal" id="modal">
<div class="questionBox">
<h2 id="question"></h2>
<div id="answers"></div>
</div>
</div>


<div class="resultScreen" id="result">

<h1 id="resultText"></h1>

<button id="actionBtn"></button>

</div>


<script>

let score=0;
let answered=0;
let currentHut;

const questions=[

{
q:"Should boys and girls have equal access to education?",
o:["No","Yes","Only in cities"],
a:1
},

{
q:"Can women become leaders?",
o:["No","Yes","Only sometimes"],
a:1
},

{
q:"Should household work only be done by women?",
o:["Yes","No","Depends"],
a:1
},

{
q:"Do men and women deserve equal pay for equal work?",
o:["No","Yes","Only adults"],
a:1
},

{
q:"Can girls study science and engineering?",
o:["No","Yes","Only if talented"],
a:1
},

{
q:"Should everyone be treated fairly?",
o:["Yes","No","Only friends"],
a:0
},

{
q:"Can boys express emotions?",
o:["No","Yes","Never"],
a:1
},

{
q:"Gender equality means:",
o:["Equal rights","Only women rights","Only men rights"],
a:0
},

{
q:"Can women participate in sports?",
o:["No","Yes","Rarely"],
a:1
},

{
q:"Should opportunities depend on gender?",
o:["Yes","No","Sometimes"],
a:1
}

];

function openQuestion(index,hut){

currentHut=hut;

document.getElementById("modal").style.display="flex";

document.getElementById("question").innerText=
questions[index].q;

let html="";

questions[index].o.forEach((choice,i)=>{

html+=`
<button class="option"
onclick="checkAnswer(${i},${questions[index].a})">
${choice}
</button>
`;

});

document.getElementById("answers").innerHTML=html;

}


function checkAnswer(selected,correct){

if(selected===correct){
score++;
document.getElementById("score").innerText=score;
}

answered++;

currentHut.classList.add("disabled");

document.getElementById("modal").style.display="none";

if(answered===10){

setTimeout(showResult,500);

}

}


function showResult(){

document.getElementById("result").style.display="flex";

if(score<8){

document.getElementById(
"resultText"
).innerHTML=
`
Challenge Again!<br>
You got ${score}/10
`;

document.getElementById(
"actionBtn"
).innerText="Retry";

document.getElementById(
"actionBtn"
).onclick=()=>location.reload();

}

else{

document.getElementById(
"resultText"
).innerHTML=
`
Proceed to Next Level!<br>
You got ${score}/10
`;

document.getElementById(
"actionBtn"
).innerText="Next Level";

document.getElementById(
"actionBtn"
).onclick=()=>{
window.location.href="level2.html"
};

}

}

</script>

</body>
</html>
