<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SDGs Gender Equality</title>
<style>
body{
margin:0;
font-family:Arial;
overflow:hidden;
background:linear-gradient(#87CEEB,#b7f3a1);
height:100vh;
}

.header{
position:absolute;
top:20px;
left:20px;
font-size:28px;
font-weight:bold;
}

.score{
position:absolute;
top:20px;
right:20px;
font-size:24px;
}

.village{
position:absolute;
bottom:0;
width:100%;
height:70%;
}

.hut{
position:absolute;
width:120px;
height:100px;
cursor:pointer;
transition:.3s;
}

.hut:hover{
transform:scale(1.1);
}

.hut:before{
content:"";
position:absolute;
width:0;
height:0;
border-left:60px solid transparent;
border-right:60px solid transparent;
border-bottom:60px solid #c49a6c;
top:-50px;
}

.hut:after{
content:"";
position:absolute;
width:100%;
height:80px;
background:#deb887;
bottom:0;
border-radius:10px;
}

.modal{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:20px;
width:500px;
border-radius:15px;
z-index:100;
}

.option{
margin:10px;
padding:10px;
background:#eee;
cursor:pointer;
}

.result{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:30px;
text-align:center;
border-radius:20px;
}
button{
padding:10px 20px;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="header">SDGs Gender Equality</div>
<div class="score">
Correct: <span id="score">0</span>/10
</div>

<div class="village">

<div class="hut" style="left:5%;bottom:30%"></div>
<div class="hut" style="left:20%;bottom:10%"></div>
<div class="hut" style="left:35%;bottom:35%"></div>
<div class="hut" style="left:50%;bottom:15%"></div>
<div class="hut" style="left:65%;bottom:30%"></div>
<div class="hut" style="left:80%;bottom:15%"></div>
<div class="hut" style="left:15%;bottom:55%"></div>
<div class="hut" style="left:45%;bottom:55%"></div>
<div class="hut" style="left:70%;bottom:55%"></div>
<div class="hut" style="left:85%;bottom:45%"></div>

</div>

<div class="modal" id="modal">
<h3 id="question"></h3>
<div id="options"></div>
</div>

<div class="result" id="result"></div>

<script>

const questions=[
{
q:"Should boys and girls have equal access to education?",
o:["Yes","No"],
a:"Yes"
},
{
q:"Can women become leaders?",
o:["Yes","No"],
a:"Yes"
},
{
q:"Only boys should play sports?",
o:["True","False"],
a:"False"
},
{
q:"Equal pay means?",
o:["Same work same pay","Men paid more"],
a:"Same work same pay"
},
{
q:"Girls can study science?",
o:["Yes","No"],
a:"Yes"
},
{
q:"Should household work be shared?",
o:["Yes","No"],
a:"Yes"
},
{
q:"Can men become nurses?",
o:["Yes","No"],
a:"Yes"
},
{
q:"Gender equality means?",
o:["Fair opportunities","Only helping girls"],
a:"Fair opportunities"
},
{
q:"Can women become engineers?",
o:["Yes","No"],
a:"Yes"
},
{
q:"Everyone deserves respect?",
o:["Yes","No"],
a:"Yes"
}
];

let current=0;
let score=0;

const huts=document.querySelectorAll(".hut");

huts.forEach((hut,index)=>{

hut.onclick=()=>{

if(hut.dataset.done)return;

showQuestion(index);
hut.dataset.done=true;
hut.style.opacity=.5;

}

})

function showQuestion(i){

let q=questions[current];

document.getElementById("modal").style.display="block";
question.innerText=q.q;

options.innerHTML="";

q.o.forEach(x=>{

let div=document.createElement("div");

div.className="option";
div.innerText=x;

div.onclick=()=>{

if(x==q.a){
score++;
score.innerText=score;
document.getElementById("score").innerText=score;
}

current++;

modal.style.display="none";

if(current==10){
finishGame();
}

}

options.appendChild(div);

})

}

function finishGame(){

let result=document.getElementById("result");

result.style.display="block";

if(score<8){

result.innerHTML=`
<h2>Challenge Again</h2>
<button onclick="location.reload()">
Retry
</button>`;

}
else{

result.innerHTML=`
<h2>Proceed to Next Level</h2>
<button onclick="location='level2.html'">
Next Level
</button>`;

}

}

</script>

</body>
</html>
