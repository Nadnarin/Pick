<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SDGs Gender Equality Expert Certificate</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(
135deg,
#ffd1dc,
#fff3b0,
#c8f7c5
);
min-height:100vh;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:20px;
}

/* Controls */

.controls{
margin-bottom:30px;
text-align:center;
}

input{

padding:12px;
font-size:18px;
width:300px;
border-radius:10px;
border:2px solid #ccc;
margin-right:10px;
}

button{

padding:12px 20px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
background:#4CAF50;
color:white;
}

/* Certificate */

.certificate{

width:900px;
max-width:95%;
background:white;
padding:50px;
border:12px solid gold;
border-radius:20px;
text-align:center;
box-shadow:0 0 30px rgba(0,0,0,.2);
position:relative;
}

.certificate:before{

content:"🏆";
font-size:80px;

position:absolute;
top:20px;
right:30px;
}

.cert-title{

font-size:42px;
font-weight:bold;
color:#e67e22;
margin-top:20px;
}

.subtitle{

font-size:24px;
margin-top:20px;
}

.name{

font-size:40px;
font-weight:bold;
color:#2c3e50;
margin:35px 0;
border-bottom:3px solid black;
display:inline-block;
padding:10px 30px;
min-width:300px;
}

.text{

font-size:22px;
line-height:1.7;
margin-top:20px;
}

.footer{

margin-top:60px;
display:flex;
justify-content:space-between;
font-size:18px;
}

.signature{

border-top:2px solid black;
padding-top:10px;
width:180px;
margin:auto;
}

/* Print settings */

@media print{

body{
background:white;
}

.controls{
display:none;
}

button{
display:none;
}

input{
display:none;
}

}

</style>
</head>
<body>


<div class="controls">

<h2>Enter Your Name</h2>

<input
type="text"
id="nameInput"
placeholder="Your Name"
oninput="updateName()"
/>

<button onclick="downloadCertificate()">
Download Certificate
</button>

</div>



<div class="certificate">

<div class="cert-title">
SDGs Gender Equality Expert
</div>

<div class="subtitle">

Certificate of Achievement

</div>

<div class="text">
This certificate is proudly awarded to
</div>

<div class="name" id="displayName">

Your Name

</div>

<div class="text">

For successfully completing the SDGs Gender Equality learning game and demonstrating excellent understanding of gender equality concepts.

</div>


<div class="footer">

<div>

Date:<br>
<span id="date"></span>

</div>

<div class="signature">

Learning Achievement

</div>

</div>

</div>


<script>

function updateName(){

let name=
document.getElementById(
"nameInput"
).value;

document.getElementById(
"displayName"
).innerText=
name || "Your Name";

}

function downloadCertificate(){

updateName();

window.print();

}

const today=new Date();

document.getElementById(
"date"
).innerText=
today.toLocaleDateString();

</script>

</body>
</html>
