<!DOCTYPE html>
<html>
<head>
<title>Certificate</title>

<style>

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f2f2f2;
font-family:Arial;
}

.certificate{

width:900px;
padding:50px;
background:white;
text-align:center;
border:10px solid gold;
}

input{
padding:10px;
font-size:20px;
margin:20px;
}

button{
padding:12px 20px;
font-size:18px;
}

@media print{

button,input{
display:none;
}

}

</style>
</head>

<body>

<div class="certificate">

<h1>SDGs Gender Equality Expert</h1>

<h2>Certificate of Achievement</h2>

<p>This certifies that</p>

<h1 id="displayName">
Your Name
</h1>

<p>has successfully completed the SDGs Gender Equality learning game.</p>

<input
id="nameInput"
placeholder="Enter your name"
oninput="updateName()">

<br>

<button onclick="window.print()">
Download
</button>

</div>

<script>

function updateName(){

let name=document.getElementById("nameInput").value;

document.getElementById("displayName").innerText=
name || "Your Name";

}

</script>

</body>
</html>
