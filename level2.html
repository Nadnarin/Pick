<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SDGs Gender Equality – Scenario Questions</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial,sans-serif;
height:100vh;
background:linear-gradient(
to bottom,
#87CEEB 0%,
#87CEEB 60%,
#7ed957 60%
);
}

/* Header */

.header{
position:absolute;
top:20px;
left:20px;
font-size:28px;
font-weight:bold;
z-index:100;
}

.score{
position:absolute;
top:20px;
right:20px;
font-size:24px;
font-weight:bold;
z-index:100;
}

/* amusement park */

.roller{
position:absolute;
bottom:180px;
left:50px;
font-size:100px;
}

.wheel{
position:absolute;
bottom:140px;
right:120px;
font-size:120px;
}

.tent{
position:absolute;
bottom:120px;
left:40%;
font-size:100px;
}

/* flowers */

.flower{
position:absolute;
font-size:50px;
cursor:pointer;
transition:.3s;
}

.flower:hover{
transform:scale(1.2);
}

/* question modal */

.modal{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:25px;
width:80%;
max-width:700px;
border-radius:20px;
z-index:500;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

.dropAreaContainer{
display:flex;
justify-content:space-between;
margin-top:20px;
gap:20px;
}

.box{
flex:1;
min-height:150px;
padding:10px;
border:3px dashed gray;
border-radius:15px;
}

.equality{
background:#d4ffd4;
}

.inequality{
background:#ffd4d4;
}

.draggable{
padding:10px;
background:#ffd966;
margin:10px;
border-radius:10px;
cursor:grab;
}

.submitBtn{
margin-top:20px;
padding:10px 20px;
font-size:18px;
cursor:pointer;
}

/* Result */

.resultScreen{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 0 30px rgba(0,0,0,.4);
z-index:1000;
}

.resultScreen h1{
font-size:40px;
}

button{
padding:12px 20px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

</style>
</head>
<body>

<div class="header">
SDGs Gender Equality – Scenario Questions
</div>

<div class="score">
Correct: <span id="score">0</span>/6
</div>


<div class="roller">🎢</div>
<div class="wheel">🎡</div>
<div class="tent">🎪</div>

<div id="flowers"></div>


<div class="modal" id="questionModal">

<h2 id="questionTitle"></h2>

<div id="dragItems"></div>

<div class="dropAreaContainer">

<div class="box equality"
ondrop="drop(event)"
ondragover="allowDrop(event)"
id="equalBox">

<h3>Gender Equality</h3>

</div>

<div class="box inequality"
ondrop="drop(event)"
ondragover="allowDrop(event)"
id="inequalBox">

<h3>Gender Inequality</h3>

</div>

</div>

<button class="submitBtn" onclick="checkAnswer()">
Submit
</button>

</div>


<div class="resultScreen" id="result">

<h1 id="resultText"></h1>

<div id="resultButton"></div>

</div>

<script>

let score=0;
let completed=0;
let currentQuestion=0;

const questionSets=[

{
title:"Question Set 1",
items:[
{text:"Boys and girls can join any sports team",correct:"equal"},
{text:"Only boys can become engineers",correct:"inequal"}
]
},

{
title:"Question Set 2",
items:[
{text:"Parents support education equally",correct:"equal"},
{text:"Girls should only do housework",correct:"inequal"}
]
},

{
title:"Question Set 3",
items:[
{text:"Everyone deserves equal opportunities",correct:"equal"},
{text:"Leadership roles belong only to men",correct:"inequal"}
]
}

];



function createFlowers(){

const container=document.getElementById("flowers");

for(let i=0;i<3;i++){

let flower=document.createElement("div");

flower.className="flower";
flower.innerHTML="🌸";

flower.style.left=
(Math.random()*80+5)+"%";

flower.style.top=
(Math.random()*25+65)+"%";

flower.onclick=()=>openQuestion(i);

container.appendChild(flower);

}

}

createFlowers();



function openQuestion(index){

if(questionSets[index].done)return;

currentQuestion=index;

document.getElementById(
"questionTitle"
).innerText=
questionSets[index].title;

let dragArea=
document.getElementById(
"dragItems"
);

dragArea.innerHTML="";

document.getElementById(
"equalBox"
).innerHTML=
"<h3>Gender Equality</h3>";

document.getElementById(
"inequalBox"
).innerHTML=
"<h3>Gender Inequality</h3>";

questionSets[index].items.forEach(
(item,i)=>{

let div=document.createElement("div");

div.className="draggable";

div.id="item"+i;

div.draggable=true;

div.innerText=item.text;

div.dataset.correct=
item.correct;

div.ondragstart=drag;

dragArea.appendChild(div);

});

document.getElementById(
"questionModal"
).style.display="block";

}



function drag(e){

e.dataTransfer.setData(
"text",
e.target.id
);

}

function allowDrop(e){

e.preventDefault();

}

function drop(e){

e.preventDefault();

let data=e.dataTransfer.getData(
"text"
);

e.target.appendChild(
document.getElementById(data)
);

}



function checkAnswer(){

let equal=
document.getElementById(
"equalBox"
);

let inequal=
document.getElementById(
"inequalBox"
);

let correctCount=0;

equal.querySelectorAll(
".draggable"
).forEach(item=>{

if(item.dataset.correct=="equal")
correctCount++;

});

inequal.querySelectorAll(
".draggable"
).forEach(item=>{

if(item.dataset.correct=="inequal")
correctCount++;

});

score+=correctCount;
completed+=2;

document.getElementById(
"score"
).innerText=score;

questionSets[
currentQuestion
].done=true;

document.getElementById(
"questionModal"
).style.display="none";

document.querySelectorAll(
".flower"
)[currentQuestion]
.style.opacity=".3";

if(completed>=6){

showResult();

}

}



function showResult(){

let text="";

let button="";

if(score<=2){

text="Keep Trying";

button=
`<button onclick='location.reload()'>
Try Again
</button>`;

}

else if(score<=4){

text="Making Progress";

button=
`<button onclick='location.reload()'>
Try Again
</button>`;

}

else{

text="Gender Equality Expert";

button=
`<button onclick="window.location.href='certificate.html'">
Download Learning Certificate
</button>`;

}

document.getElementById(
"resultText"
).innerText=text;

document.getElementById(
"resultButton"
).innerHTML=button;

document.getElementById(
"result"
).style.display="block";

}

</script>

</body>
</html>
