<!DOCTYPE html>
<html>
<head>
<title>SDGs Gender Equality – Scenario Questions</title>

<style>
body{
margin:0;
font-family:Arial;
height:100vh;
overflow:hidden;
background:
linear-gradient(#87CEEB,#b6f2ff,#7ee77e);
}

.header{
position:absolute;
top:20px;
left:20px;
font-size:28px;
font-weight:bold;
}

.score{
position:absolute;
top:20px;
right:20px;
font-size:24px;
}

.flower{
position:absolute;
font-size:50px;
cursor:pointer;
}

.box{
position:absolute;
bottom:30px;
width:35%;
height:150px;
border:3px dashed;
padding:10px;
}

.eq{
left:5%;
background:#d9ffd9;
}

.ineq{
right:5%;
background:#ffd6d6;
}

.card{
padding:10px;
margin:10px;
background:white;
cursor:grab;
}

#cards{
position:absolute;
top:120px;
left:50%;
transform:translateX(-50%);
width:60%;
}

.result{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:30px;
}
</style>
</head>

<body>

<div class="header">
SDGs Gender Equality – Scenario Questions
</div>

<div class="score">
Correct: <span id="score">0</span>/6
</div>

<div id="flowers"></div>
<div id="cards"></div>

<div class="box eq"
ondrop="drop(event,'eq')"
ondragover="allowDrop(event)">
Gender Equality
</div>

<div class="box ineq"
ondrop="drop(event,'ineq')"
ondragover="allowDrop(event)">
Gender Inequality
</div>

<div class="result" id="result"></div>

<script>

const sets=[

[
{text:"Girls and boys have equal school opportunities",type:"eq"},
{text:"Women cannot be leaders",type:"ineq"}
],

[
{text:"Men and women receive same pay",type:"eq"},
{text:"Only boys can play sports",type:"ineq"}
],

[
{text:"Household tasks shared equally",type:"eq"},
{text:"Girls should avoid science",type:"ineq"}
]

];

let current=0;
let score=0;
let done=0;

for(let i=0;i<3;i++){

let flower=document.createElement("div");

flower.className="flower";
flower.innerHTML="🌸";

flower.style.left=Math.random()*80+"%";
flower.style.top=(50+Math.random()*40)+"%";

flower.onclick=()=>{

loadSet(i);
flower.remove();

}

flowers.appendChild(flower);

}

function loadSet(i){

cards.innerHTML="";

sets[i].forEach((c,index)=>{

let d=document.createElement("div");

d.className="card";
d.innerText=c.text;
d.draggable=true;

d.id="card"+index;

d.dataset.type=c.type;

d.ondragstart=e=>{

e.dataTransfer.setData("text",d.id)

}

cards.appendChild(d)

})

}

function allowDrop(e){
e.preventDefault()
}

function drop(e,type){

e.preventDefault()

let id=e.dataTransfer.getData("text");

let item=document.getElementById(id);

if(item){

if(item.dataset.type==type){
score++;
document.getElementById("score").innerText=score;
}

item.remove();

done++;

if(done==6){
finish();
}

}

}

function finish(){

let r=document.getElementById("result");

r.style.display="block";

if(score<=2){

r.innerHTML=`
<h2>Keep Trying</h2>
<button onclick='location.reload()'>Try Again</button>`;

}

else if(score<=4){

r.innerHTML=`
<h2>Making Progress</h2>
<button onclick='location.reload()'>Try Again</button>`;

}

else{

r.innerHTML=`
<h2>Gender Equality Expert</h2>
<button onclick='location="certificate.html"'>
Download Learning Certificate
</button>`;

}

}

</script>

</body>
</html>
